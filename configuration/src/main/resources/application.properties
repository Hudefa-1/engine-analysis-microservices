spring.application.name=configuration

# FLUID
resilience4j.circuitbreaker.instances.fluidService.sliding-window-size=2
resilience4j.circuitbreaker.instances.fluidService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.fluidService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.fluidService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.fluidService.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.fluidService.automatic-transition-from-open-to-half-open-enabled=true

# MECHANICAL
resilience4j.circuitbreaker.instances.mechanicalService.sliding-window-size=2
resilience4j.circuitbreaker.instances.mechanicalService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.mechanicalService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.mechanicalService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mechanicalService.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.mechanicalService.automatic-transition-from-open-to-half-open-enabled=true

# ELECTRICAL
resilience4j.circuitbreaker.instances.electricalService.sliding-window-size=2
resilience4j.circuitbreaker.instances.electricalService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.electricalService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.electricalService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.electricalService.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.electricalService.automatic-transition-from-open-to-half-open-enabled=true

# ENGINE MANAGEMENT
resilience4j.circuitbreaker.instances.engineManagementService.sliding-window-size=2
resilience4j.circuitbreaker.instances.engineManagementService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.engineManagementService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.engineManagementService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.engineManagementService.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.engineManagementService.automatic-transition-from-open-to-half-open-enabled=true

fluid.service.url=${FLUID_SERVICE_URL:http://localhost:8081}
mechanical.service.url=${MECHANICAL_SERVICE_URL:http://localhost:8082}
electrical.service.url=${ELECTRICAL_SERVICE_URL:http://localhost:8083}
engine-management.service.url=${ENGINE_MANAGEMENT_SERVICE_URL:http://localhost:8084}